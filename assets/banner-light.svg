<svg width="1280" height="400" viewBox="0 0 1280 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="claude-scholar — one source of truth, your university's rules, verified citations, character budgets">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E7E5DC"/>
      <stop offset="1" stop-color="#DCD9CB"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>

  <text x="640" y="150" text-anchor="middle" font-family="ui-serif, Georgia, 'Times New Roman', serif" font-size="58" fill="#1F2430">claude-scholar</text>

  <g text-anchor="middle" font-family="'SF Mono','Menlo','Consolas',monospace">
    <text x="235" y="264" font-size="16" font-weight="600" letter-spacing="1.2" fill="#1F2430">ONE SOURCE OF TRUTH</text>
    <text x="235" y="288" font-size="13" letter-spacing="0.3" fill="#6E6D62">every fact, one file, no drift</text>

    <text x="505" y="264" font-size="16" font-weight="600" letter-spacing="1.2" fill="#1F2430">UNIVERSITY RULES</text>
    <text x="505" y="288" font-size="13" letter-spacing="0.3" fill="#6E6D62">not generic academic advice</text>

    <text x="775" y="264" font-size="16" font-weight="600" letter-spacing="1.2" fill="#1F2430">VERIFIED CITATIONS</text>
    <text x="775" y="288" font-size="13" letter-spacing="0.3" fill="#6E6D62">checked against real databases</text>

    <text x="1045" y="264" font-size="16" font-weight="600" letter-spacing="1.2" fill="#1F2430">CHARACTER BUDGETS</text>
    <text x="1045" y="288" font-size="13" letter-spacing="0.3" fill="#6E6D62">tracked per section</text>
  </g>
</svg>
